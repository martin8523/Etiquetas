<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Etiquetas de Inventario • Declas Style</title>
  <!-- Librerías para Código de Barras Code128 y Generación de PDF -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger-bg: #fef2f2;
      --danger-text: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header minimalista y elegante */
    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 20px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--text-main);
    }

    header span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Layout principal en Grid */
    .app-container {
      max-width: 1400px;
      margin: 32px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 460px 1fr;
      gap: 32px;
      align-items: start;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Tarjetas / Paneles */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Formularios */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      color: var(--text-main);
      background: #fff;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Tabla de ítems con diseño limpio */
    .items-wrapper {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
      background: #fafafa;
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .items-table th {
      background: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 10px 12px;
      text-align: left;
    }

    .items-table td {
      padding: 8px 12px;
      border-top: 1px solid var(--border-color);
      vertical-align: middle;
    }

    .items-table input {
      padding: 7px 10px;
      font-size: 0.9rem;
    }

    .add-row-container {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Botones */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      margin-top: 6px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    }

    .btn-accent {
      background-color: var(--accent);
      color: white;
      margin-top: 12px;
    }

    .btn-accent:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn-small {
      padding: 8px 12px;
      width: auto;
      font-size: 0.85rem;
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-small:hover {
      background: #e2e8f0;
    }

    .btn-delete {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger-text);
      color: white;
    }

    /* Insignias de información */
    .info-box {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-top: 16px;
      line-height: 1.5;
    }

    .info-box strong {
      color: var(--accent);
    }

    /* Área de Previsualización */
    .preview-container {
      background: #f1f5f9;
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-height: 82vh;
      overflow-y: auto;
    }

    /* Tarjeta de Etiqueta (7cm x 14cm según plantilla Word) */
    .etiqueta-card {
      width: 7cm;
      height: 14cm;
      background: #ffffff;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-lg);
      padding: 0.9cm 0.35cm 0.5cm 0.35cm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      color: #000000;
      position: relative;
      page-break-after: always;
      break-after: page;
      border-radius: 4px;
    }

    .etiqueta-card.landscape {
      width: 14cm;
      height: 7cm;
      padding: 0.35cm 0.6cm;
    }

    .etq-item {
      font-size: 34pt;
      font-weight: 800;
      line-height: 1.05;
      text-transform: uppercase;
      word-break: break-word;
      margin-top: 4px;
    }

    .etiqueta-card.landscape .etq-item {
      font-size: 24pt;
      margin-top: 0;
    }

    .etq-meta {
      font-size: 11.5pt;
      line-height: 1.45;
      margin: 4px 0;
    }

    .etiqueta-card.landscape .etq-meta {
      font-size: 10.5pt;
      line-height: 1.25;
      margin: 2px 0;
    }

    .etq-inv-title {
      font-size: 12pt;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    .etq-serie {
      font-size: 40pt;
      font-weight: 800;
      line-height: 1;
      margin: 2px 0;
    }

    .etiqueta-card.landscape .etq-serie {
      font-size: 28pt;
    }

    .etq-barcode-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 2px;
    }

    .etq-barcode-wrap svg {
      max-width: 94%;
      height: 68px;
    }

    .etiqueta-card.landscape .etq-barcode-wrap svg {
      height: 46px;
    }

    .etq-footer {
      font-size: 12pt;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    /* Estilos de Impresión Directa */
    @media print {
      body {
        background: none;
      }
      header, .no-print {
        display: none !important;
      }
      .app-container {
        display: block;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .card {
        border: none;
        box-shadow: none;
        padding: 0;
        background: none;
      }
      .preview-container {
        border: none;
        background: none;
        padding: 0;
        max-height: none;
        overflow: visible;
        display: block;
      }
      .etiqueta-card {
        border: none;
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
  <style id="dynamic-page-style">
    @page { size: 7cm 14cm; margin: 0; }
  </style>
</head>
<body>

<header class="no-print">
  <div>
    <h1>Generador de Etiquetas de Inventario</h1>
    <span>Estilo Minimalista & Profesional</span>
  </div>
  <span id="badgeContadorTop" style="background:#f1f5f9; padding:6px 12px; border-radius:20px; font-weight:600; color:var(--text-main); border:1px solid var(--border-color);">0 etiquetas</span>
</header>

<div class="app-container">
  <!-- Panel de Configuración Estilo Declas -->
  <div class="card no-print">
    <h2>Configuración de Lote</h2>

    <div class="row-2">
      <div class="form-group">
        <label for="serieInicio">Serie Inicial</label>
        <input type="number" id="serieInicio" value="6658" min="1" />
      </div>
      <div class="form-group">
        <label for="orientacion">Formato</label>
        <select id="orientacion" onchange="cambiarOrientacion()">
          <option value="portrait">Vertical (7×14 cm)</option>
          <option value="landscape">Horizontal (14×7 cm)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Ítems Apilados en Lote Correlativo</label>
      <div class="items-wrapper">
        <table class="items-table">
          <thead>
            <tr>
              <th>Ítem / Modelo</th>
              <th style="width: 75px;">Cant.</th>
              <th style="width: 45px; text-align: center;">✕</th>
            </tr>
          </thead>
          <tbody id="tbodyItems"></tbody>
        </table>
      </div>

      <div class="add-row-container">
        <select id="selectModeloPrueba" style="flex:1;">
          <option value="N15">N15</option>
          <option value="SEMI">SEMI</option>
          <option value="SEMI T">SEMI T</option>
          <option value="EXTRA">EXTRA</option>
          <option value="TIERRA N 15">TIERRA N 15</option>
        </select>
        <input type="text" id="inputCustomModelo" placeholder="O escribir..." style="flex:1;" />
        <button type="button" class="btn btn-small" onclick="agregarFilaItem()">Añadir</button>
      </div>
    </div>

    <div class="form-group">
      <label for="fabricante">Fabricante / Proveedor</label>
      <input type="text" id="fabricante" value="Coop de Coop" placeholder="Ej: Coop de Coop" />
    </div>

    <div class="form-group">
      <label for="fechaIngreso">Fecha de Ingreso</label>
      <input type="date" id="fechaIngreso" />
    </div>

    <button type="button" class="btn btn-accent" onclick="descargarPDF()">
      Descargar PDF Vectorial
    </button>

    <button type="button" class="btn btn-primary" onclick="window.print()">
      Imprimir Directamente
    </button>

    <div class="info-box" id="resumenRango">
      Calculando resumen...
    </div>
  </div>

  <!-- Panel de Vista Previa Limpio -->
  <div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;" class="no-print">
      <h3 style="margin:0; font-size:0.95rem; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Vista Previa en Tiempo Real</h3>
    </div>
    <div class="preview-container" id="previewContainer"></div>
  </div>
</div>

<script>
  // Inicializar fecha de hoy
  const hoy = new Date();
  const yyyy = hoy.getFullYear();
  const mm = String(hoy.getMonth() + 1).padStart(2, '0');
  const dd = String(hoy.getDate()).padStart(2, '0');
  document.getElementById('fechaIngreso').value = `${yyyy}-${mm}-${dd}`;

  // Lista inicial de ítems apilados
  let listaItems = [
    { item: 'N15', cantidad: 5 },
    { item: 'SEMI', cantidad: 15 }
  ];

  function inicializarTabla() {
    const tbody = document.getElementById('tbodyItems');
    tbody.innerHTML = '';
    listaItems.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><input type="text" value="${escapeAttr(row.item)}" oninput="actualizarItem(${index}, 'item', this.value)" /></td>
        <td><input type="number" min="1" max="300" value="${row.cantidad}" oninput="actualizarItem(${index}, 'cantidad', this.value)" /></td>
        <td style="text-align:center;"><button type="button" class="btn-delete" onclick="eliminarFila(${index})">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
    renderizarEtiquetas();
  }

  function agregarFilaItem() {
    const customVal = document.getElementById('inputCustomModelo').value.trim();
    const selectVal = document.getElementById('selectModeloPrueba').value;
    const modeloFinal = customVal !== '' ? customVal.toUpperCase() : selectVal;

    listaItems.push({ item: modeloFinal, cantidad: 5 });
    document.getElementById('inputCustomModelo').value = '';
    inicializarTabla();
  }

  function eliminarFila(index) {
    if (listaItems.length <= 1) {
      alert("Debe mantenerse al menos un ítem.");
      return;
    }
    listaItems.splice(index, 1);
    inicializarTabla();
  }

  function actualizarItem(index, campo, valor) {
    if (campo === 'cantidad') {
      listaItems[index][campo] = parseInt(valor, 10) || 1;
    } else {
      listaItems[index][campo] = valor;
    }
    renderizarEtiquetas();
  }

  function formatearFecha(isoDate) {
    if (!isoDate) return '';
    const [y, m, d] = isoDate.split('-');
    return `${parseInt(d, 10)}/${parseInt(m, 10)}/${y}`;
  }

  function cambiarOrientacion() {
    const orientacion = document.getElementById('orientacion').value;
    const pageStyle = document.getElementById('dynamic-page-style');
    if (orientacion === 'portrait') {
      pageStyle.innerHTML = `@page { size: 7cm 14cm; margin: 0; }`;
    } else {
      pageStyle.innerHTML = `@page { size: 14cm 7cm; margin: 0; }`;
    }
    renderizarEtiquetas();
  }

  function obtenerLoteCompleto() {
    const serieInicio = parseInt(document.getElementById('serieInicio').value, 10) || 1;
    const fabricante = document.getElementById('fabricante').value.trim();
    const fecha = formatearFecha(document.getElementById('fechaIngreso').value);
    const orientacion = document.getElementById('orientacion').value;

    let etiquetas = [];
    let serieActual = serieInicio;

    listaItems.forEach(group => {
      const cant = Math.max(1, parseInt(group.cantidad, 10) || 1);
      const nombreItem = group.item.trim() || 'ITEM';
      for (let i = 0; i < cant; i++) {
        etiquetas.push({
          item: nombreItem,
          serie: String(serieActual),
          fabricante,
          fecha
        });
        serieActual++;
      }
    });

    const serieFin = serieActual - 1;
    return { etiquetas, serieInicio, serieFin, total: etiquetas.length, orientacion };
  }

  function renderizarEtiquetas() {
    const { etiquetas, serieInicio, serieFin, total, orientacion } = obtenerLoteCompleto();
    const container = document.getElementById('previewContainer');
    container.innerHTML = '';

    document.getElementById('resumenRango').innerHTML =
      total > 0
        ? `Se generarán <strong>${total}</strong> etiquetas. Correlatividad continua: del <strong>${serieInicio}</strong> al <strong>${serieFin}</strong>.`
        : `Sin etiquetas en el lote.`;

    document.getElementById('badgeContadorTop').textContent = `${total} etiqueta(s)`;

    etiquetas.forEach((etq, idx) => {
      const card = document.createElement('div');
      card.className = `etiqueta-card ${orientacion === 'landscape' ? 'landscape' : ''}`;

      card.innerHTML = `
        <div class="etq-item">${escapeHtml(etq.item)}</div>
        <div class="etq-meta">
          <div>Prov: ${escapeHtml(etq.fabricante)}</div>
          <div>Fecha de Ingreso: ${escapeHtml(etq.fecha)}</div>
          <div class="etq-inv-title">INVENTARIO</div>
        </div>
        <div class="etq-serie">${escapeHtml(etq.serie)}</div>
        <div class="etq-barcode-wrap">
          <svg id="barcode-${idx}"></svg>
        </div>
        <div class="etq-footer">CONSUMIDO</div>
      `;

      container.appendChild(card);

      JsBarcode(`#barcode-${idx}`, etq.serie, {
        format: "CODE128",
        lineColor: "#000000",
        width: 2.4,
        height: orientacion === 'landscape' ? 44 : 65,
        displayValue: false,
        margin: 0
      });
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function escapeAttr(text) {
    return text.replace(/"/g, '&quot;');
  }

  function descargarPDF() {
    const { jsPDF } = window.jspdf;
    const { etiquetas, orientacion } = obtenerLoteCompleto();

    if (etiquetas.length === 0) {
      alert("No hay etiquetas para generar.");
      return;
    }

    const isPortrait = orientacion === 'portrait';
    const doc = new jsPDF({
      orientation: isPortrait ? 'portrait' : 'landscape',
      unit: 'mm',
      format: isPortrait ? [70, 140] : [140, 70]
    });

    const pageW = isPortrait ? 70 : 140;
    const centerX = pageW / 2;

    etiquetas.forEach((etq, idx) => {
      if (idx > 0) {
        doc.addPage(isPortrait ? [70, 140] : [140, 70], isPortrait ? 'portrait' : 'landscape');
      }

      const canvas = document.createElement('canvas');
      JsBarcode(canvas, etq.serie, {
        format: "CODE128",
        lineColor: "#000000",
        width: 3,
        height: 80,
        displayValue: false,
        margin: 0
      });
      const barcodeDataUrl = canvas.toDataURL('image/png');

      doc.setTextColor(0, 0, 0);

      if (isPortrait) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(etq.item.length > 7 ? 24 : 32);
        doc.text(etq.item, centerX, 22, { align: 'center', maxWidth: 64 });

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        doc.text(`Prov: ${etq.fabricante}`, centerX, 38, { align: 'center', maxWidth: 64 });
        doc.text(`Fecha de Ingreso: ${etq.fecha}`, centerX, 45, { align: 'center', maxWidth: 64 });

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11.5);
        doc.text('INVENTARIO', centerX, 55, { align: 'center' });

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(38);
        doc.text(etq.serie, centerX, 74, { align: 'center' });

        const bcWidth = 54;
        const bcHeight = 24;
        doc.addImage(barcodeDataUrl, 'PNG', centerX - bcWidth / 2, 84, bcWidth, bcHeight);

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12);
        doc.text('CONSUMIDO', centerX, 124, { align: 'center' });
      } else {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(22);
        doc.text(etq.item, centerX, 12, { align: 'center', maxWidth: 130 });

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(`Prov: ${etq.fabricante}   |   Fecha de Ingreso: ${etq.fecha}`, centerX, 19, { align: 'center', maxWidth: 130 });

        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10.5);
        doc.text('INVENTARIO', centerX, 26, { align: 'center' });

        doc.setFontSize(26);
        doc.text(etq.serie, centerX, 37, { align: 'center' });

        const bcWidth = 68;
        const bcHeight = 16;
        doc.addImage(barcodeDataUrl, 'PNG', centerX - bcWidth / 2, 41, bcWidth, bcHeight);

        doc.setFontSize(10.5);
        doc.text('CONSUMIDO', centerX, 64, { align: 'center' });
      }
    });

    const primerSerie = etiquetas[0].serie;
    const ultimaSerie = etiquetas[etiquetas.length - 1].serie;
    doc.save(`Lote_Etiquetas_${primerSerie}_a_${ultimaSerie}.pdf`);
  }

  document.getElementById('serieInicio').addEventListener('input', renderizarEtiquetas);
  document.getElementById('fabricante').addEventListener('input', renderizarEtiquetas);
  document.getElementById('fechaIngreso').addEventListener('change', renderizarEtiquetas);

  inicializarTabla();
</script>
</body>
</html>
